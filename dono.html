      <div class="grid-form">

          <h3>Receita</h3>

        <article class="card-resumo">
          <h3>Custos</h3>
          <p id="custosTotal">—</p>
        </article>

        <article class="card-resumo">
          <h3>Lucro</h3>
          <p id="lucroTotal">—</p>
        </article>
      </div>
    </section>

    <section class="painel">
      <h2>Gerenciamento</h2>
      <p><a href="./funcionarios.html">Gerenciar funcionários</a></p>
      <p><a href="./estoque.html">Abrir estoque</a></p>
      <p><a href="./vendas.html">Abrir vendas</a></p>
      <p><a href="./cozinha.html">Abrir cozinha</a></p>
      <p><a href="./cliente.html">Portal do cliente</a></p>
    </section>

    <section class="painel">
      <h2>Ajuda e suporte</h2>
      <button type="button" onclick="alert('Manual do proprietário em preparação.')">
        Abrir manual
      </button>
      <button type="button" onclick="alert('Configure aqui o canal de suporte da Creamy.')">
        Suporte técnico
      </button>
    </section>
  </main>

  <script type="module" src="./firebase-v2/dono.js"></script>

</html>
